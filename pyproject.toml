[project]
name = "pkgwatch"
version = "0.1.0"
description = "Package behavior diff monitor for npm, PyPI and crates.io"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7,<3"]

[project.scripts]
pkgwatch = "pkgwatch.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkgwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
show_error_codes = true
pretty = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Ruff 0.17 formats Python fences in Markdown; SPEC.md's schema block is column-aligned.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "PT", "C4", "RET", "PIE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
